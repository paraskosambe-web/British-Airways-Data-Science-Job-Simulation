<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-label="Animated flight path from flight search to completed booking" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#01295c"/>
      <stop offset="60%" stop-color="#075aaa"/>
      <stop offset="100%" stop-color="#0b3d7a"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eb2226"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="900" height="160" rx="18" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="28" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="18" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="30" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="16" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="132" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="22" r="1.4"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.13">
    <g>
      <ellipse cx="150" cy="120" rx="46" ry="9"/>
      <ellipse cx="180" cy="114" rx="30" ry="8"/>
      <animateTransform attributeName="transform" type="translate" values="-40 0; 60 0; -40 0" dur="14s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="600" cy="138" rx="56" ry="10"/>
      <ellipse cx="640" cy="131" rx="34" ry="8"/>
      <animateTransform attributeName="transform" type="translate" values="50 0; -50 0; 50 0" dur="16s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="420" cy="70" rx="40" ry="7"/>
      <animateTransform attributeName="transform" type="translate" values="-30 0; 40 0; -30 0" dur="12s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- faint full route -->
  <path id="route" d="M 70 120 C 260 10, 470 160, 830 44" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-48" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- drawn trail -->
  <path d="M 70 120 C 260 10, 470 160, 830 44" pathLength="1000" fill="none" stroke="url(#trail)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.85;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- origin -->
  <circle cx="70" cy="120" r="7" fill="#ffffff"/>
  <circle cx="70" cy="120" r="7" fill="none" stroke="#ffffff" stroke-width="2">
    <animate attributeName="r" values="7;20;7" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- destination -->
  <circle cx="830" cy="44" r="7" fill="#eb2226"/>
  <circle cx="830" cy="44" r="7" fill="none" stroke="#eb2226" stroke-width="2">
    <animate attributeName="r" values="7;22;7" dur="2.4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="2.4s" begin="1s" repeatCount="indefinite"/>
  </circle>

  <!-- plane -->
  <g>
    <polygon points="16,0 6,-3 -2,-3 -8,-14 -12,-14 -8,-3 -14,-3 -16,-8 -19,-8 -17,0 -19,8 -16,8 -14,3 -8,3 -12,14 -8,14 -2,3 6,3" fill="#ffffff" stroke="#01295c" stroke-width="0.8" transform="scale(1.25)"/>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
  </g>

  <!-- labels -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">
    <text x="48" y="150" fill="#ffffff" opacity="0.9">FLIGHT SEARCH</text>
    <text x="852" y="80" fill="#ffffff" text-anchor="end" opacity="0.95">BOOKING COMPLETE</text>
  </g>
</svg>
